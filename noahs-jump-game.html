let _ac = null;
function ac() {
  if (!_ac) _ac = new (window.AudioContext || window.webkitAudioContext)();
  if (_ac.state === 'suspended') _ac.resume();
  return _ac;
}
function sfxJump(first) {
  const a=ac(),o=a.createOscillator(),g=a.createGain();
  o.connect(g);g.connect(a.destination);o.type='square';
  const t=a.currentTime;
  o.frequency.setValueAtTime(first?220:440,t);
  o.frequency.exponentialRampToValueAtTime(first?520:920,t+.11);
  g.gain.setValueAtTime(.13,t);g.gain.exponentialRampToValueAtTime(.001,t+.14);
  o.start(t);o.stop(t+.14);
}

  const a=ac(),o=a.createOscillator(),g=a.createGain();
  o.connect(g);g.connect(a.destination);o.type='sine';

  o.frequency.setValueAtTime(1050,t);o.frequency.setValueAtTime(1400,t+.04);
  g.gain.setValueAtTime(.09,t);g.gain.exponentialRampToValueAtTime(.001,t+.1);

  o.connect(g);g.connect(a.destination);o.type='sawtooth';
  o.frequency.setValueAtTime(380,t);o.frequency.exponentialRampToValueAtTime(38,t+.45);
  g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.45);
  o.start(t);o.stop(t+.45);
  const len=Math.floor(a.sampleRate*.18),buf=a.createBuffer(1,len,a.sampleRate);
  const d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const s=a.createBufferSource();s.buffer=buf;
  const ng=a.createGain();s.connect(ng);ng.connect(a.destination);
  ng.gain.setValueAtTime(.25,t);ng.gain.exponentialRampToValueAtTime(.001,t+.18);s.start(t);
}

  [16,784,2],[18,698,1],[19,659,1],[20,587,2],[22,659,2],[24,440,4],[28,659,3],
  [32,880,2],[34,784,1],[35,659,1],[36,698,2],[38,659,2],[40,523,1],[41,587,1],
  [42,659,1],[43,587,1],[44,659,3],[48,880,2],[50,784,2],[52,659,2],[54,523,2],
  [56,587,3],[60,659,1],[62,440,2]];
const BASS=[[0,220,3.5],[4,262,3.5],[8,330,3.5],[12,220,3.5],[16,196,3.5],[20,262,3.5],
  [24,330,3.5],[28,165,3.5],[32,220,3.5],[36,262,3.5],[40,330,3.5],[44,220,3.5],
  [48,147,3.5],[52,175,3.5],[56,262,3.5],[60,165,3.5]];
const KICKS=[0,8,16,24,32,40,48,56],SNARES=[4,12,20,28,36,44,52,60],
  HIHATS=[2,6,10,14,18,22,26,30,34,38,42,46,50,54,58,62];
function initMusic(){
  if(musicStarted)return; musicStarted=true;
  const a=ac(); mGain=a.createGain(); mGain.gain.value=.45; mGain.connect(a.destination);
  schedMus(a.currentTime);
}
function toggleMute(){ musicOn=!musicOn; if(mGain)mGain.gain.setTargetAtTime(musicOn?.45:0,ac().currentTime,.05); }
function musNote(hz,type,vol,t,dur){
  const a=ac(),o=a.createOscillator(),g=a.createGain();
  o.connect(g);g.connect(mGain);o.type=type;o.frequency.value=hz;
  const rel=Math.min(.05,dur*.25);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);
  g.gain.setValueAtTime(vol,t+dur-rel);g.gain.linearRampToValueAtTime(0,t+dur);
  o.start(t);o.stop(t+dur+.01);
}
function schedMus(t0){
  const a=ac();
  MELO.forEach(([s,hz,d])=>musNote(hz,'square',.065,t0+s*S16,d*S16*.82));
  BASS.forEach(([s,hz,d])=>{musNote(hz*.5,'triangle',.18,t0+s*S16,d*S16*.88);musNote(hz,'sine',.06,t0+s*S16,d*S16*.88);});
  KICKS.forEach(s=>{
    const t=t0+s*S16,o=a.createOscillator(),g=a.createGain();
    o.connect(g);g.connect(mGain);o.type='sine';
    o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(35,t+.12);
    g.gain.setValueAtTime(.55,t);g.gain.exponentialRampToValueAtTime(.001,t+.14);
    o.start(t);o.stop(t+.15);
  });
  SNARES.forEach(s=>{
    const t=t0+s*S16,len=Math.floor(a.sampleRate*.08);
    const buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    const src=a.createBufferSource();src.buffer=buf;
    const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=2200;f.Q.value=.8;
    const g=a.createGain();src.connect(f);f.connect(g);g.connect(mGain);
    g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.08);src.start(t);
  });
  HIHATS.forEach(s=>{
    const t=t0+s*S16,len=Math.floor(a.sampleRate*.025);
    const buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    const src=a.createBufferSource();src.buffer=buf;
    const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=9000;
    const g=a.createGain();src.connect(f);f.connect(g);g.connect(mGain);
    g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.025);src.start(t);
  });
  setTimeout(()=>schedMus(t0+LDUR), Math.max(10,(t0+LDUR-a.currentTime-.5)*1000));
}

// ── Stars / dust ─────────────────────────────────────────────────────────
function initStars(){
  stars=Array.from({length:90},()=>({x:Math.random(),y:Math.random()*.72,r:Math.random()*1.4+.3,phase:Math.random()*Math.PI*2}));
  bgDust=Array.from({length:12},()=>({x:Math.random(),y:Math.random()*.65,r:Math.random()*3+2,phase:Math.random()*Math.PI*2,col:['#ff44aa','#44aaff','#ffaa00','#44ffaa'][Math.floor(Math.random()*4)]}));
}

// ── Reset level ──────────────────────────────────────────────────────────
function resetLevel(lv){
  currentLevel=lv; score=0; frame=0; deathTimer=-1;
  flyMode=false; flyTimer=0; rocketMode=false; selectedChar=savedChar;
  obstacles=[]; portalObjs=[]; particles=[]; checkpointObjs=[]; lastCheckpoint=null;
  const ld=LEVELS[lv-1];
  speed=4*(W()/700)*ld.spd;
  const gmin=W()*ld.gap[0],gmax=W()*ld.gap[1];
  nextObs=gmin+Math.random()*(gmax-gmin);
  nextPortalIn=ld.portals?(W()*.9+Math.random()*W()*.6):Infinity;
  nextCpScore=Math.max(4,Math.ceil(ld.count/3));
  levelAttempts++; attemptBanner=120;
  orbObjs=[]; padObjs=[]; coinObjs=[]; speedPortalObjs=[]; gravPortalObjs=[]; trail=[];
  gravFlip=false; gravFlipTimer=0; coinIdx=0;
  poopObj=null; poopSpawnScore=Math.floor(3+Math.random()*(ld.count*.55));
  const saved=collectedCoins['lv'+lv]||[false,false,false];
  levelCoins=[saved[0]||false,saved[1]||false,saved[2]||false];
  coinSpawnScores=[Math.floor(ld.count*.28),Math.floor(ld.count*.55),Math.floor(ld.count*.78)].filter(s=>s>0&&s<ld.count);
  const [gn2,gx2]=ld.gap;
  nextOrbIn=W()*gn2+Math.random()*W()*(gx2-gn2);
  nextPadIn=W()*gn2*1.6+Math.random()*W()*(gx2-gn2)*2;
  nextSpeedIn=ld.count>10?W()*1.2+Math.random()*W()*1.8:Infinity;
  nextGravIn=ld.count>18?W()*2+Math.random()*W()*2.5:Infinity;
  bossProjectiles=[];
  if(ld.boss){bossObj={x:W()*.78,y:H()*.35,vy:.8,hp:ld.count,maxHp:ld.count,flash:0};bossIntroTimer=180;}
  else{bossObj=null;bossIntroTimer=0;}
  const sz=SZ();
  player={x:W()*.14,y:GY()-sz,w:sz,h:sz,vy:0,jumps:0,angle:0,alive:true,prevY:GY()-sz};
}

// ── Spawners ─────────────────────────────────────────────────────────────
function spawnObs(){
  const sz=SZ(),gy=GY(),ld=LEVELS[currentLevel-1];
  const type=ld.types[Math.floor(Math.random()*ld.types.length)];
  let o={type,x:W()+20};
  if(type==='spike') {o.y=gy-sz;   o.w=sz*.9;   o.h=sz;}
  else if(type==='block'){o.y=gy-sz;  o.w=sz;      o.h=sz;}
  else if(type==='dspike'){o.y=gy-sz; o.w=sz*1.95; o.h=sz;}
  else {o.y=gy-sz*1.9; o.w=sz;      o.h=sz*1.9;}
  obstacles.push(o);
  const [gn,gx]=ld.gap;
  nextObs=W()*gn+Math.random()*W()*(gx-gn);
}
function spawnPortal(){
  const sz=SZ(),gy=GY();
  portalObjs.push({x:W()+20,y:gy-sz*2.1,w:sz*.85,h:sz*2.1,rot:0});
  nextPortalIn=W()*(.9+Math.random()*.7);
}
function spawnCheckpoint(){
  const sz=SZ(),gy=GY();
  checkpointObjs.push({x:W()+20,y:gy,poleH:sz*2.8,activated:false,flash:0});
}

function spawnOrb(){
  const sz=SZ(),gy=GY(),ld=LEVELS[currentLevel-1];
  const h=gy-sz*(1.1+Math.random()*2.4);
  orbObjs.push({x:W()+20,y:h,r:sz*.36,used:false});

  nextOrbIn=W()*gn*1.1+Math.random()*W()*(gx-gn)*1.8;

function spawnPad(type){

}
function spawnCoin(){
  const sz=SZ(),gy=GY();
  const yh=gy-sz*(1.4+Math.random()*2.2);
  coinObjs.push({x:W()+20,y:yh,r:sz*.26,idx:coinIdx++,collected:false,spin:0});
}
function spawnSpeedPortal(){
  const sz=SZ(),gy=GY(),ld=LEVELS[currentLevel-1];
  const types=['slow','fast','vfast'];
  const type=types[Math.floor(Math.random()*types.length)];
  speedPortalObjs.push({x:W()+20,y:gy-sz*2.2,w:sz*.7,h:sz*2.2,type});
  const [gn,gx]=ld.gap;

}
function spawnGravPortal(){
  const sz=SZ(),gy=GY();
  gravPortalObjs.push({x:W()+20,y:gy-sz*2.6,w:sz*.7,h:sz*2.6,rot:0});

}

// ── Particles ────────────────────────────────────────────────────────────
function pJumpFx(){
  const cx=player.x+player.w/2,by=player.y+player.h;
  ['#00cfff','#0088ff','#fff','#ffdd00'].forEach(c=>{
    particles.push({x:cx+(Math.random()-.5)*player.w*.6,y:by,vx:(Math.random()-.5)*2.5,vy:Math.random()*2+.5,life:22,max:22,col:c,sz:Math.random()*3+1.5});
  });
}
function pDeathFx(){
  const cx=player.x+player.w/2,cy=player.y+player.h/2;
  for(let i=0;i<24;i++){
    const a=(i/24)*Math.PI*2,sp=Math.random()*5+2;
    particles.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.5,life:40,max:40,
      col:['#00cfff','#f30','#ffdd00','#f80','#fff'][i%5],sz:Math.random()*6+2});
  }
}
function pPortalFx(px,py){
  for(let i=0;i<18;i++){
    const a=(i/18)*Math.PI*2;
    particles.push({x:px,y:py,vx:Math.cos(a)*3.5,vy:Math.sin(a)*3.5-1,life:32,max:32,
      col:['#f4f','#a0f','#0ff','#fff'][i%4],sz:Math.random()*4+2});
  }
}
function pCheckpointFx(px,py){
  for(let i=0;i<20;i++){
    const a=(i/20)*Math.PI*2;
    particles.push({x:px,y:py,vx:Math.cos(a)*3,vy:Math.sin(a)*3-1.5,life:36,max:36,
      col:['#00ff88','#ffdd00','#00cfff','#ffffff'][i%4],sz:Math.random()*5+2});

}

function pCoinFx(px,py){
  for(let i=0;i<14;i++){
    const a=(i/14)*Math.PI*2;
    particles.push({x:px,y:py,vx:Math.cos(a)*3,vy:Math.sin(a)*3-2,life:28,max:28,

// ── Collision helper ──────────────────────────────────────────────────────
function overlaps(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

// ── Kill ─────────────────────────────────────────────────────────────────
function kill(){
  if(!player.alive)return;
  player.alive=false; sfxDeath(); pDeathFx();
  // Practice mode: shorter delay then auto-respawn; real mode: longer delay then dead screen
  deathTimer = practiceMode ? 40 : 55;
}
function retryFromCheckpoint(){
  const ld=LEVELS[currentLevel-1];
  const cp=lastCheckpoint;
  score    = cp ? cp.score : 0;
  speed    = cp ? cp.speed : 4*(W()/700)*ld.spd;
  obstacles=[]; portalObjs=[]; checkpointObjs=[]; particles=[]; deathTimer=-1;
  bossProjectiles=[];
  if(bossObj){bossObj.hp=bossObj.maxHp-(cp?cp.score:0);bossObj.flash=0;}
  orbObjs=[]; padObjs=[]; coinObjs=[]; speedPortalObjs=[]; gravPortalObjs=[]; trail=[];
  gravFlip=false; gravFlipTimer=0; coinIdx=0;
  poopObj=null;
  const ldR2=LEVELS[currentLevel-1];
  poopSpawnScore=(cp?cp.score:0)+Math.floor(3+Math.random()*(ldR2.count*.45));
  levelAttempts++; attemptBanner=100;
  const ldR=LEVELS[currentLevel-1];
  coinSpawnScores=[Math.floor(ldR.count*.28),Math.floor(ldR.count*.55),Math.floor(ldR.count*.78)].filter(s=>s>0&&s<ldR.count&&s>(cp?cp.score:0));
  const [gnR,gxR]=ldR.gap;
  nextOrbIn=W()*gnR+Math.random()*W()*(gxR-gnR);
  nextPadIn=W()*gnR*1.6+Math.random()*W()*(gxR-gnR)*2;
  nextSpeedIn=ldR.count>10?W()*1.2+Math.random()*W()*1.8:Infinity;
  nextGravIn=ldR.count>18?W()*2+Math.random()*W()*2.5:Infinity;
  flyMode=false; flyTimer=0; rocketMode=false; selectedChar=savedChar;
  const gmin=W()*ld.gap[0],gmax=W()*ld.gap[1];
  nextObs=gmin+Math.random()*(gmax-gmin);
  nextPortalIn=ld.portals?(W()*.9+Math.random()*W()*.6):Infinity;
  nextCpScore = (cp?cp.score:0) + Math.max(4,Math.ceil(ld.count/3));
  const sz=SZ();
  player={x:W()*.14,y:GY()-sz,w:sz,h:sz,vy:0,jumps:0,angle:0,alive:true,prevY:GY()-sz};
  state='playing';
}

// ── Input ────────────────────────────────────────────────────────────────
function pRocketFx(){
  const cy=player.y+player.h/2;
  particles.push({x:player.x+Math.random()*4,y:cy+(Math.random()-.5)*player.h*.35,
    vx:-(2+Math.random()*2.5),vy:(Math.random()-.5)*1.5,life:14,max:14,
    col:['#ff8800','#ffdd00','#ff4400','#ff6600'][Math.floor(Math.random()*4)],sz:Math.random()*4+2});
}
function doJump(){
  if(state==='playing'&&player.alive){
    const isRocket=selectedChar===4;
    // Orb check first
    for(let i=0;i<orbObjs.length;i++){
      const o=orbObjs[i];if(o.used)continue;
      const cx=player.x+player.w/2,cy=player.y+player.h/2;
      if(Math.hypot(cx-o.x,cy-o.y)<o.r+player.w*.58){
        o.used=true;
        player.vy = gravFlip ? (13*(H()/320)) : -(13*(H()/320));
        sfxOrb(); return;
      }
    }
    if(flyMode||isRocket){
      player.vy = gravFlip ? (8*(H()/320)) : -(8*(H()/320));
      if(isRocket)pRocketFx();
    } else if(player.jumps<2){
      player.vy = gravFlip ? (12+(H()-220)*.018) : -(12+(H()-220)*.018);
      sfxJump(player.jumps===0); player.jumps++; pJumpFx();
    }
  }
}
document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(state==='dead'){startLevel(currentLevel);}else{doJump();}}
  if(e.code==='Escape'||e.code==='KeyP') togglePause();
  if(e.code==='KeyM') toggleMute();
  if(e.code==='KeyR') toggleRocket();
});
canvas.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const r=canvas.getBoundingClientRect();
  const mx=(e.clientX-r.left)*(W()/r.width);
  const my=(e.clientY-r.top)*(H()/r.height);
  initMusic();
  // Check buttons first
  for(const[name,b]of Object.entries(btns)){
    if(mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h){btn(name);return;}
  }
  // Tap anywhere on dead screen retries (buttons may have missed due to layout)
  if(state==='dead'){startLevel(currentLevel);return;}
  doJump();
});
function togglePause(){
  if(state==='playing')state='paused';
  else if(state==='paused')state='playing';
}
function toggleRocket(){
  if(CHARS[selectedChar]?.isRocketType){selectedChar=savedChar;rocketMode=false;}
  else{savedChar=selectedChar;selectedChar=savedRocketChar;rocketMode=true;}
}
function btn(name){
  switch(name){
    case 'pause':    togglePause();break;
    case 'resume':   togglePause();break;
    case 'restart':  startLevel(currentLevel);break;
    case 'retry':    startLevel(currentLevel);break;
    case 'retryCP':  retryFromCheckpoint();break;
    case 'mute':     toggleMute();break;
    case 'practice': practiceMode=!practiceMode;break;
    case 'levels':   state='levelSelect';break;
    case 'back':     state='charSelect';break;
    case 'play':     state='levelSelect';break;
    case 'next':     startLevel(Math.min(currentLevel+1,35));break;
    case 'rocket':   toggleRocket();break;
    default:
      if(name.startsWith('ch')){
        const i=parseInt(name.slice(2)); selectedChar=i; savedChar=i;
        if(CHARS[i]?.isRocketType) savedRocketChar=i;
      }
      if(name.startsWith('hue')){
        playerHue=parseInt(name.slice(3));
        lsSet('noah_hue',playerHue);
      }
      if(name.startsWith('lv')){
        const n=parseInt(name.slice(2));
        if(n<=unlocked){startLevel(n);}
      }
  }
}
function startLevel(lv){
  currentLevel=lv; state='playing'; initMusic(); resetLevel(lv);
}

// ── Draw helpers ──────────────────────────────────────────────────────────
function gl(col,blur){ctx.shadowColor=col;ctx.shadowBlur=blur;}
function ngl(){ctx.shadowBlur=0;}
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}
function mkBtn(name,x,y,w,h){btns[name]={x,y,w,h};}

// ── Background ────────────────────────────────────────────────────────────
function getBgHue(){
  if(state==='charSelect'||state==='levelSelect')return 260;
  const lv=currentLevel,ld=LEVELS[lv-1];
  const prog=(state==='playing'||state==='paused')?Math.min(1,score/(ld.count||1)):0;
  const h1=LEVEL_HUES[lv-1];
  const h2=LEVEL_HUES[Math.min(lv,24)];
  return h1+(h2-h1)*(prog*.35);
}
function drawBg(isSpace){
  const gy=GY(),h=getBgHue();
  const g=ctx.createLinearGradient(0,0,0,gy);
  g.addColorStop(0,`hsl(${h},85%,4%)`);
  g.addColorStop(1,`hsl(${(h+30)%360},70%,10%)`);
  ctx.fillStyle=g; ctx.fillRect(0,0,W(),gy);
  // Stars
  ctx.save();
  stars.forEach(s=>{
    const alpha=.45+.45*Math.sin(s.phase+frame*.018);
    ctx.globalAlpha=alpha; gl('#aaf',4); ctx.fillStyle='#ccddff';
    ctx.beginPath();ctx.arc(s.x*W(),s.y*H(),s.r,0,Math.PI*2);ctx.fill(); ngl();
  });
  if(isSpace){
    bgDust.forEach(p=>{
      ctx.globalAlpha=.04+.02*Math.sin(p.phase+frame*.005);
      ctx.fillStyle=p.col;
      const bx=((p.x*W()-bgOff*.025)%(W()+200)+W()+200)%(W()+200)-100;
      ctx.beginPath();ctx.arc(bx,p.y*H(),p.r*22,0,Math.PI*2);ctx.fill();
    });
    // Distant planet
    ctx.globalAlpha=.07; ctx.fillStyle='#5533aa';
    const px=((W()*.68-bgOff*.008)%(W()*2.2)+W()*2.2)%(W()*2.2)-W()*.4;
    ctx.beginPath();ctx.arc(px,H()*.28,H()*.2,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=.03; ctx.fillStyle='#2200aa';
    ctx.beginPath();ctx.arc(px,H()*.28,H()*.28,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
  // Speed lines
  ctx.save();ctx.strokeStyle='#ffffff07';ctx.lineWidth=1;
  for(let i=0;i<9;i++){
    const lx=((bgOff*.25+i*(W()/8))%(W()+60))-60;
    ctx.beginPath();ctx.moveTo(lx,0);ctx.lineTo(lx-gy*.4,gy);ctx.stroke();
  }
  ctx.restore();
}
function drawGround(){
  const gy=GY(),sz=SZ(),h=getBgHue();
  const g=ctx.createLinearGradient(0,gy,0,H());
  g.addColorStop(0,`hsl(${h},70%,8%)`);
  g.addColorStop(1,`hsl(${h},60%,3%)`);
  ctx.fillStyle=g;ctx.fillRect(0,gy,W(),H()-gy);
  ctx.save();ctx.strokeStyle='#ffffff14';ctx.lineWidth=1;
  const off=bgOff%sz;
  for(let x=-off;x<W()+sz;x+=sz){ctx.beginPath();ctx.moveTo(x,gy);ctx.lineTo(x,H());ctx.stroke();}
  for(let y=gy;y<H()+sz;y+=sz){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W(),y);ctx.stroke();}
  ctx.restore();
  gl('#00cfff',14);ctx.strokeStyle='#00cfff';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W(),gy);ctx.stroke();ngl();
}
function drawSpike(o){
  const{x,y,w,h}=o;
  gl('#f50',14);ctx.fillStyle='#f60';
  // y = tip (top), y+h = base (ground)
  ctx.beginPath();ctx.moveTo(x,y+h);ctx.lineTo(x+w/2,y);ctx.lineTo(x+w,y+h);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#faa';ctx.lineWidth=1.5;ctx.stroke();ngl();
}
function drawDSpike(o){
  const hw=o.w/2;
  drawSpike({x:o.x,y:o.y,w:hw*.93,h:o.h});
  drawSpike({x:o.x+hw*1.07,y:o.y,w:hw*.93,h:o.h});
}
function drawBlock(o){

function drawCheckpoint(cp){
  const sz=SZ(),gy=GY(),ph=cp.poleH,pw=sz*.1;

  const wave=Math.sin(frame*.09)*sz*.05;
  ctx.fillStyle=col;
  ctx.beginPath();
  ctx.moveTo(px+pw,py);
  ctx.lineTo(px+pw+sz*.65,py+sz*.22+wave);
  ctx.lineTo(px+pw+sz*.5,py+sz*.46);
  ctx.lineTo(px+pw,py+sz*.5);
  ctx.closePath();ctx.fill();ngl();

}
function charGlow(){ return `hsl(${playerHue},90%,55%)`; }

function drawTrail(){
  ctx.save();
  for(let i=trail.length-1;i>=0;i--){
    const t=trail[i]; t.life--;
    if(t.life<=0){trail.splice(i,1);continue;}
    ctx.globalAlpha=t.life/t.maxLife*.45;
    ctx.save();ctx.translate(t.x,t.y);
    const ch=CHARS[t.char];
    if(!ch){}
    else if(ch.name==='Cube'||ch.name==='Noah'||ch.name==='Blue'||ch.name==='Gold'||ch.name==='RedFace'||ch.name==='YelloFace'){
      ctx.rotate(t.angle);const s=t.sz*.43;
      ctx.strokeStyle=t.col;ctx.lineWidth=1.5;ctx.strokeRect(-s,-s,s*2,s*2);
    } else if(ch.emoji){
      ctx.font=`${t.sz*.82}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(ch.emoji,0,0);
    }
    ctx.restore();
  }
  ctx.globalAlpha=1;ctx.restore();
}
function drawOrb(o){

  if(!o.used){ctx.strokeStyle='#ffffffaa';ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,o.r*.55,0,Math.PI*2);ctx.stroke();}

function drawPlayer(p){
  ctx.save();

    const pulse=.6+.4*Math.sin(frame*.15);
    gl('#ffdd00',22*pulse);
    ctx.fillStyle=`rgba(255,220,0,${.15*pulse})`;

  }

    ctx.strokeStyle='#0f0';ctx.lineWidth=2;

  }
  gl(cg,14);
  ctx.textAlign='center';ctx.textBaseline='middle';
  if(ch.emoji==='🚀'){
    // Natural emoji points ~45° up-right; rotate clockwise ~20° more so it leans forward in flight

    ctx.rotate(Math.PI/9+tilt);

    gl(cg,12);ctx.strokeStyle=cg;ctx.lineWidth=2;ctx.strokeRect(-s,-s,s*2,s*2);ngl();
    ctx.drawImage(NOAH_IMG,-s,-s,s*2,s*2);
  } else if(ch.name==='Cube'){
    ctx.rotate(p.angle);

    gl(cg,16);
    ctx.fillStyle=cg+'22';ctx.fillRect(-s,-s,s*2,s*2);
    ctx.strokeStyle=cg;ctx.lineWidth=2.5;ctx.strokeRect(-s,-s,s*2,s*2);
    ctx.strokeStyle=cg+'88';ctx.lineWidth=1;ctx.strokeRect(-s*.5,-s*.5,s,s);
    ctx.beginPath();ctx.moveTo(-s,-s);ctx.lineTo(s,s);ctx.moveTo(s,-s);ctx.lineTo(-s,s);ctx.stroke();
    ngl();
  } else if(ch.name==='Blue'||ch.name==='Gold'){
    ctx.rotate(p.angle);
    const cubeColor=ch.name==='Blue'?'#0066ff':'#ffcc00';
    const s=p.w*.46;
    gl(cubeColor,16);
    ctx.fillStyle=cubeColor+'22';ctx.fillRect(-s,-s,s*2,s*2);
    ctx.strokeStyle=cubeColor;ctx.lineWidth=2.5;ctx.strokeRect(-s,-s,s*2,s*2);
    ctx.strokeStyle=cubeColor+'88';ctx.lineWidth=1;ctx.strokeRect(-s*.5,-s*.5,s,s);
    ctx.beginPath();ctx.moveTo(-s,-s);ctx.lineTo(s,s);ctx.moveTo(s,-s);ctx.lineTo(-s,s);ctx.stroke();
    ngl();
  } else if(ch.name==='RedFace'){
    ctx.rotate(p.angle);
    const s=p.w*.46;
    gl('#ff2200',16);
    ctx.fillStyle='#cc1100';ctx.fillRect(-s,-s,s*2,s*2);
    ctx.strokeStyle='#ff4422';ctx.lineWidth=2.5;ctx.strokeRect(-s,-s,s*2,s*2);
    ctx.fillStyle='#ffdd00';
    ctx.beginPath();ctx.arc(-s*.3,-s*.15,s*.18,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(s*.3,-s*.15,s*.18,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';
    ctx.beginPath();ctx.arc(-s*.3,-s*.12,s*.08,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(s*.3,-s*.12,s*.08,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#ffdd00';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,s*.1,s*.3,.15*Math.PI,.85*Math.PI);ctx.stroke();
    ngl();
  } else if(ch.name==='YelloFace'){
    ctx.rotate(p.angle);
    const s=p.w*.46;
    gl('#ffe033',18);
    const r=s*.35;
    ctx.fillStyle='#ffe84a';
    ctx.beginPath();ctx.moveTo(-s+r,-s);ctx.lineTo(s-r,-s);ctx.quadraticCurveTo(s,-s,s,-s+r);
    ctx.lineTo(s,s-r);ctx.quadraticCurveTo(s,s,s-r,s);ctx.lineTo(-s+r,s);
    ctx.quadraticCurveTo(-s,s,-s,s-r);ctx.lineTo(-s,-s+r);ctx.quadraticCurveTo(-s,-s,-s+r,-s);

    ctx.strokeStyle='#e8c000';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#2277cc';
    ctx.beginPath();ctx.ellipse(-s*.28,-s*.12,s*.22,s*.19,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(s*.28,-s*.12,s*.22,s*.19,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(0,s*.28,s*.33,s*.18,0,0,Math.PI*2);ctx.fill();
    ngl();
  } else {
    ctx.font=`${p.w*1.02}px serif`;

}

function drawHUD(){
  const ld=LEVELS[currentLevel-1];

  // Progress bar
  const bx=W()*.02,by=H()*.03,bw=W()*.6,bh=H()*.045;
  ctx.fillStyle='#ffffff18';ctx.fillRect(bx,by,bw,bh);
  const bc=flyMode?'#ffdd00':(prog>=1?'#00ff88':'#00cfff');

  ctx.strokeStyle='#ffffff33';ctx.lineWidth=1;ctx.strokeRect(bx,by,bw,bh);
  // 3 coin indicators right of bar
  [0,1,2].forEach(i=>{
    const cx2=bx+bw+W()*.015+i*(H()*.034+W()*.005),cy2=by+bh*.5;
    const got=levelCoins[i];
    gl(got?'#ffdd00':'#ffffff22',got?8:2);

    ctx.beginPath();ctx.arc(cx2,cy2,H()*.014,0,Math.PI*2);ctx.fill();

  // Level & score text

    gl('#0f0',10);ctx.fillStyle='#0f0';ctx.font=`bold ${H()*.04}px 'Courier New'`;
    ctx.textAlign='center';ctx.fillText('PRACTICE MODE',W()/2,by+bh+H()*.055);
  }
  if(flyMode){
    const fw=W()*.35,fx=W()*.32,fy=H()*.1;

    ctx.fillText('✈ FLY MODE',W()/2,fy+H()*.07);

  ngl();ctx.textAlign='left';
  const isRocketActive=CHARS[selectedChar]?.isRocketType;

  iconBtn(rx-isz-gap,gap,isz,isRocketActive?'🔄':'🚀','rocket',isRocketActive?'#00ff44':null);
  iconBtn(rx-isz*2-gap*2,gap,isz,'↺','restart');

      ctx.strokeStyle='#ffcc0088';ctx.lineWidth=1;ctx.strokeRect(-ps*.5,-ps*.5,ps,ps);
      ctx.beginPath();ctx.moveTo(-ps,-ps);ctx.lineTo(ps,ps);ctx.moveTo(ps,-ps);ctx.lineTo(-ps,ps);ctx.stroke();ngl();
    } else if(ch.name==='RedFace'){
      gl('#ff2200',12);ctx.fillStyle='#cc1100';ctx.fillRect(-ps,-ps,ps*2,ps*2);
      ctx.strokeStyle='#ff4422';ctx.lineWidth=2;ctx.strokeRect(-ps,-ps,ps*2,ps*2);
      ctx.fillStyle='#ffdd00';
      ctx.beginPath();ctx.arc(-ps*.3,-ps*.18,ps*.21,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(ps*.3,-ps*.18,ps*.21,0,Math.PI*2);ctx.fill();

      ctx.beginPath();ctx.arc(-ps*.3,-ps*.13,ps*.09,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(ps*.3,-ps*.13,ps*.09,0,Math.PI*2);ctx.fill();

      ctx.beginPath();ctx.arc(0,ps*.16,ps*.33,.15*Math.PI,.85*Math.PI);ctx.stroke();ngl();
    } else if(ch.name==='YelloFace'){
      const r=ps*.35;
      gl('#ffe033',14);ctx.fillStyle='#ffe84a';
      ctx.beginPath();ctx.moveTo(-ps+r,-ps);ctx.lineTo(ps-r,-ps);ctx.quadraticCurveTo(ps,-ps,ps,-ps+r);
      ctx.lineTo(ps,ps-r);ctx.quadraticCurveTo(ps,ps,ps-r,ps);ctx.lineTo(-ps+r,ps);
      ctx.quadraticCurveTo(-ps,ps,-ps,ps-r);ctx.lineTo(-ps,-ps+r);ctx.quadraticCurveTo(-ps,-ps,-ps+r,-ps);
      ctx.closePath();ctx.fill();
      ctx.strokeStyle='#e8c000';ctx.lineWidth=1.5;ctx.stroke();
      ctx.fillStyle='#2277cc';
      ctx.beginPath();ctx.ellipse(-ps*.28,-ps*.12,ps*.22,ps*.19,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(ps*.28,-ps*.12,ps*.22,ps*.19,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(0,ps*.28,ps*.33,ps*.18,0,0,Math.PI*2);ctx.fill();
      ngl();
    } else if(ch.emoji){
      ctx.font=`${ps*1.85}px serif`;ctx.fillText(ch.emoji,0,2);

  ctx.strokeStyle='#ffffff44';ctx.lineWidth=1;rr(W()*.01,H()*.02,bbw,bbh,bbh*.25);ctx.stroke();
  ctx.fillStyle='#fff';ctx.font=`${bbh*.46}px 'Courier New'`;ctx.textAlign='center';ctx.textBaseline='middle';

// ── Main Loop ─────────────────────────────────────────────────────────────
function loop(){
  requestAnimationFrame(loop);
  frame++; btns={};
  if(frame===1){const t=document.getElementById('safari-tip');if(t)t.style.display='none';}
  ctx.clearRect(0,0,W(),H());
  const isSpace=(state==='playing'||state==='paused'||state==='dead'||state==='levelComplete')
    &&LEVELS[currentLevel-1].theme==='space';
  drawBg(isSpace);

  if(state==='charSelect'){bgOff+=.5;drawCharSelect();return;}
  if(state==='levelSelect'){bgOff+=.3;drawLevelSelect();return;}

  drawGround();
  orbObjs.forEach(drawOrb);
  padObjs.forEach(drawPad);
  coinObjs.forEach(drawCoin);
  drawPoop();
  speedPortalObjs.forEach(drawSpeedPortal);
  gravPortalObjs.forEach(drawGravPortal);
  checkpointObjs.forEach(drawCheckpoint);
  portalObjs.forEach(drawPortal);
  drawObstacles();
  drawTrail();
  if(player&&player.alive)drawPlayer(player);
  drawParticles();
  drawBoss();

  if(state==='playing'){
    bgOff+=speed;
    // Physics
    const isRocket=CHARS[selectedChar]?.isRocketType===true;
    const grav=(flyMode||isRocket)?.04*(H()/320):gravFlip?-.4*(H()/320):.58*(H()/320);
    player.prevY=player.y;
    player.vy+=grav; player.y+=player.vy;
    // Ground/ceiling clamp
    if(gravFlip){
      if(player.y<=0){player.y=0;player.vy=0;player.jumps=0;}
      if(player.y+player.h>=GY())kill();
    } else {
      if(player.y+player.h>=GY()){
        player.y=GY()-player.h; player.vy=0; player.jumps=0;
        if(flyMode&&!isRocket){flyMode=false;flyTimer=0;}
      }
      if(player.y<0){player.y=0;player.vy=0;}
    }
    // Rotation (only for non-rocket characters)
    if(!isRocket){
      const spin=gravFlip?-.09:.09;
      if(player.jumps>0&&!flyMode)player.angle+=spin;
      else if(!flyMode){const s=Math.round(player.angle/(Math.PI/2))*(Math.PI/2);player.angle+=(s-player.angle)*.25;}
    }
    // GravFlip timer
    if(gravFlip){gravFlipTimer--;if(gravFlipTimer<=0){gravFlip=false;gravFlipTimer=0;}}
    // Motion trail
    if(player.alive&&frame%3===0){
      trail.push({x:player.x+player.w/2,y:player.y+player.h/2,sz:player.w,angle:player.angle,char:selectedChar,col:charGlow(),life:12,maxLife:12});
    }
    // Fly timer
    if(flyMode){flyTimer--;if(flyTimer<=0){flyMode=false;flyTimer=0;}}
    // Rocket exhaust trail (continuous)
    if(isRocket&&player.alive&&frame%2===0)pRocketFx();
    // Spawn
    nextObs-=speed; if(nextObs<=0)spawnObs();
    nextPortalIn-=speed; if(nextPortalIn<=0)spawnPortal();
    nextOrbIn-=speed; if(nextOrbIn<=0)spawnOrb();
    nextPadIn-=speed; if(nextPadIn<=0)spawnPad(['yellow','pink','red'][Math.floor(Math.random()*3)]);
    nextSpeedIn-=speed; if(nextSpeedIn<=0)spawnSpeedPortal();
    nextGravIn-=speed; if(nextGravIn<=0)spawnGravPortal();
    // Obstacles
    const ld=LEVELS[currentLevel-1];
    for(let i=obstacles.length-1;i>=0;i--){
      const o=obstacles[i]; o.x-=speed;
      if(o.x+o.w<0){
        obstacles.splice(i,1); score++; sfxScore();
        // Coin spawn
        if(coinSpawnScores.length>0&&score===coinSpawnScores[0]){
          spawnCoin(); coinSpawnScores.shift();
        }
        // Trigger checkpoint spawn at interval
        if(score===nextCpScore&&score<ld.count){
          spawnCheckpoint();
          nextCpScore+=Math.max(4,Math.ceil(ld.count/3));
        }
        if(score>=ld.count&&player.alive){
          state='levelComplete';
          bests['lv'+currentLevel]=100;lsSet('noah_bests',JSON.stringify(bests));
          // all levels unlocked from start
          sfxWin();
        }
        continue;
      }
      if(!player.alive||!overlaps(player,o))continue;
      if(o.type==='spike'||o.type==='dspike'){
        kill(); // spikes always kill — no immunity
      } else {
        // Block: land on top, die from side
        const prevBot=player.prevY+player.h;
        if(prevBot<=o.y+5&&player.vy>=0){
          player.y=o.y-player.h; player.vy=0; player.jumps=0;
        } else if(!flyMode){
          kill();
        }
      }
    }
    // Checkpoints
    for(let i=checkpointObjs.length-1;i>=0;i--){
      const cp=checkpointObjs[i]; cp.x-=speed;
      if(cp.x+SZ()<-20){checkpointObjs.splice(i,1);continue;}
      if(!cp.activated&&player.alive&&player.x+player.w>cp.x+SZ()*.3&&player.x<cp.x+SZ()*.9){
        cp.activated=true; cp.flash=60;
        lastCheckpoint={score,speed};
        pCheckpointFx(cp.x+SZ()*.5,GY()-SZ()*1.4);
        sfxCheckpoint();
      }
    }
    // Portals
    for(let i=portalObjs.length-1;i>=0;i--){
      const p=portalObjs[i]; p.x-=speed; p.rot+=.05;
      if(p.x+p.w<0){portalObjs.splice(i,1);continue;}
      if(!flyMode&&player.alive&&overlaps(player,p)){
        flyMode=true; flyTimer=FLY_FRAMES;
        pPortalFx(p.x+p.w/2,p.y+p.h/2);
        portalObjs.splice(i,1); sfxPortal();
      }
    }
    // Orbs
    for(let i=orbObjs.length-1;i>=0;i--){
      const o=orbObjs[i]; o.x-=speed;
      if(o.x+o.r<0){orbObjs.splice(i,1);}
    }
    // Pads
    for(let i=padObjs.length-1;i>=0;i--){
      const pd=padObjs[i]; pd.x-=speed;
      if(pd.x+pd.w<0){padObjs.splice(i,1);continue;}
      if(player.alive&&overlaps(player,{x:pd.x,y:pd.y-pd.h*2,w:pd.w,h:pd.h*3})){
        const force=pd.type==='red'?1.7:pd.type==='pink'?1.3:1.0;
        const up=gravFlip?1:-1;
        player.vy=up*-(14*(H()/320))*force; player.jumps=0;
        sfxPad();
      }
    }
    // Coins
    for(let i=coinObjs.length-1;i>=0;i--){
      const c=coinObjs[i]; c.x-=speed;
      if(c.x+c.r<0){coinObjs.splice(i,1);continue;}
      if(!c.collected&&player.alive){
        const cx2=player.x+player.w/2,cy2=player.y+player.h/2;
        if(Math.hypot(cx2-c.x,cy2-c.y)<c.r+player.w*.45){
          c.collected=true;
          if(c.idx<3){levelCoins[c.idx]=true; const key='lv'+currentLevel; collectedCoins[key]=levelCoins.slice(); lsSet('noah_coins',JSON.stringify(collectedCoins));}
          sfxCoin(); pCoinFx(c.x,c.y);
        }
      }
    }
    // Poop
    if(poopObj===null&&score===poopSpawnScore)spawnPoop();
    if(poopObj&&!poopObj.collected){
      poopObj.x-=speed;
      if(poopObj.x+poopObj.r<0){poopObj=null;}
      else if(player.alive){
        const _pcx=player.x+player.w/2,_pcy=player.y+player.h/2;
        if(Math.hypot(_pcx-poopObj.x,_pcy-poopObj.y)<poopObj.r+player.w*.45){
          poopObj.collected=true;sfxPoop();pCoinFx(poopObj.x,poopObj.y);
        }
      }
    }
    // Speed portals
    for(let i=speedPortalObjs.length-1;i>=0;i--){
      const sp=speedPortalObjs[i]; sp.x-=speed;
      if(sp.x+sp.w<0){speedPortalObjs.splice(i,1);continue;}
      if(player.alive&&overlaps(player,sp)){
        const base=4*(W()/700)*LEVELS[currentLevel-1].spd;
        if(sp.type==='slow') speed=Math.max(speed*.7,base*.6);
        else if(sp.type==='fast') speed=Math.min(speed*1.25,base*2.2);
        else speed=Math.min(speed*1.5,base*3);
        sfxPortal(); speedPortalObjs.splice(i,1);
      }
    }
    // Gravity portals
    for(let i=gravPortalObjs.length-1;i>=0;i--){
      const gp=gravPortalObjs[i]; gp.x-=speed;
      if(gp.x+gp.w<0){gravPortalObjs.splice(i,1);continue;}
      if(player.alive&&overlaps(player,gp)){
        gravFlip=!gravFlip; gravFlipTimer=GRAVFLIP_FRAMES;
        sfxPortal(); gravPortalObjs.splice(i,1);
      }
    }
    // Boss (level 25)
    if(bossObj){
      bossObj.y+=bossObj.vy;
      if(bossObj.y<H()*.1||bossObj.y>H()*.65)bossObj.vy*=-1;
      if(bossObj.flash>0)bossObj.flash--;
      const bossFireRate=LEVELS[currentLevel-1].superBoss?38:80;
      if(frame%bossFireRate===0){
        const dy=(player.y+player.h/2)-bossObj.y;
        const dx=player.x-bossObj.x;
        const dist=Math.sqrt(dx*dx+dy*dy)||1;
        bossProjectiles.push({x:bossObj.x-SZ()*.6,y:bossObj.y,vx:-speed*1.4-3,vy:(dy/dist)*4.5,r:SZ()*.28});
        if(LEVELS[currentLevel-1].superBoss){
          bossProjectiles.push({x:bossObj.x-SZ()*.6,y:bossObj.y+SZ()*.6,vx:-speed*1.5-4,vy:(dy/dist)*3.5+1.5,r:SZ()*.26});
          bossProjectiles.push({x:bossObj.x-SZ()*.6,y:bossObj.y-SZ()*.6,vx:-speed*1.5-4,vy:(dy/dist)*3.5-1.5,r:SZ()*.26});
        }
      }
      for(let i=bossProjectiles.length-1;i>=0;i--){
        const p=bossProjectiles[i];p.x+=p.vx;p.y+=p.vy;
        if(p.x<-20){bossProjectiles.splice(i,1);continue;}
        if(player.alive&&!flyMode){
          const cx=player.x+player.w/2,cy=player.y+player.h/2;
          if(Math.hypot(cx-p.x,cy-p.y)<p.r+player.w*.35)kill();
        }
      }
      const newHp=Math.max(0,bossObj.maxHp-score);
      if(newHp<bossObj.hp){bossObj.hp=newHp;bossObj.flash=8;}
    }
    if(bossIntroTimer>0)bossIntroTimer--;
    if(!player.alive){
      deathTimer--;
      if(deathTimer<=0){
        if(practiceMode) retryFromCheckpoint(); // auto-respawn in practice
        else {
          const _pct=Math.floor(Math.min(score/(LEVELS[currentLevel-1].count||1),1)*100);
          const _k='lv'+currentLevel;
          if(!bests[_k]||_pct>bests[_k]){bests[_k]=_pct;lsSet('noah_bests',JSON.stringify(bests));}
          state='dead';
        }
      }
    }
  }
  // Particles (always update)
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.life--;
    if(p.life<=0)particles.splice(i,1);
  }

  if(state==='playing'||state==='paused')drawHUD();
  if(attemptBanner>0&&state==='playing'){
    const ab=attemptBanner;
    const aa=ab>90?1:ab/90;
    ctx.save();ctx.globalAlpha=aa*.7;
    ctx.fillStyle='#ffffffdd';ctx.font=`bold ${H()*.058}px 'Courier New'`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(`Attempt  ${levelAttempts}`,W()/2,H()*.5);
    ctx.restore();
    attemptBanner--;
  }
  if(bossIntroTimer>0&&(state==='playing'||state==='paused')){
    const t=bossIntroTimer;
    const alpha=t>150?((180-t)/30):t>30?1:t/30;
    ctx.save();ctx.globalAlpha=Math.min(1,alpha);
    gl('#ff0044',30);ctx.fillStyle='#ff2244';ctx.textAlign='center';
    ctx.font=`bold ${H()*.11}px 'Courier New'`;
    ctx.fillText('👹  BOSS BATTLE!',W()/2,H()*.46);ngl();
    ctx.restore();
  }
  if(state==='paused')drawPauseMenu();
  if(state==='dead'){drawHUD();drawDeadScreen();}
  if(state==='levelComplete'){drawHUD();drawWinScreen();}
}

// ── Boot ──────────────────────────────────────────────────────────────────
initStars();
resetLevel(1);
loop();
</script>
